<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
  <meta name="theme-color" content="#173b57">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <title>{% if page.title != site.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <script>
    (() => {
      let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      try {
        const saved = localStorage.getItem('homepage-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
      } catch {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/research.css' | relative_url }}?v=20261017-theme">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <main id="main">{{ content }}</main>
  <footer class="site-footer wrap">
    <span>Keonsoo Lee</span>
    <span>Updated October 2026</span>
  </footer>
  <script src="{{ '/assets/js/research.js' | relative_url }}?v=20261017-theme" defer></script>
</body>
</html>
