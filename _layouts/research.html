<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
  <meta name="theme-color" content="#173b57">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <title>{% if page.title != site.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/research.css' | relative_url }}">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-header">
    <div class="header-inner wrap">
      <a class="wordmark" href="{{ '/' | relative_url }}">Keonsoo Lee<span class="wordmark-dot" aria-hidden="true">.</span></a>
      <nav id="main-nav" class="main-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}#research">Papers</a>
        <a href="{{ '/' | relative_url }}#background">Background</a>
        <a class="nav-cv" href="{{ '/assets/downloads/Keonsoo_Lee_CV.pdf' | relative_url }}">CV <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3v10m-4-4 4 4 4-4M4 14v3h12v-3" stroke="currentColor" stroke-width="1.5"/></svg></a>
      </nav>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer wrap">
    <span>Keonsoo Lee</span>
    <span>Updated October 2026</span>
  </footer>
</body>
</html>
